<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0f" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!--seo-->
    <title>ISOFORM | Digital design studio in Ooty, the Nilgiris</title>
    <meta
      name="description"
      content="ISOFORM is a digital design studio in Ooty, the Nilgiris. We design and build websites, social media, video, automation and brands for businesses across India."
    />
    <!--/seo-->
    <noscript>
      <style>
        /* Without JavaScript there is no scroll-driven intro: show the site directly. */
        .intro-stage {
          height: auto !important;
        }
        .intro-sticky,
        .intro-scene,
        .intro-screen {
          position: static !important;
          height: auto !important;
          transform: none !important;
          border-radius: 0 !important;
          overflow: visible !important;
        }
        .intro-only {
          display: none !important;
        }
        .intro-stage .intro-screen {
          cursor: auto !important;
        }
        .intro-stage .intro-screen > * {
          pointer-events: auto !important;
        }
        .intro-screen .hero {
          height: auto !important;
          min-height: 100svh !important;
        }
        .site-header[data-intro='hidden'] {
          visibility: visible !important;
        }
      </style>
    </noscript>

    <div id="root"><!--app-html--></div>
